<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHUMADOS DON ROBERTO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Arial',sans-serif;background:#F8F5F0;}
:root{--oro:#C9A961; --negro:#1A1A1A; --whatsapp:#25D366; --verde:#2E7D32;}
header{background:var(--negro); color:#fff; padding:15px 0; border-bottom:3px solid var(--oro);}
.nav{max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; padding:0 20px;}
.logo-header{display:flex; align-items:center; gap:15px;}
.logo-img{width:50px; height:50px; border-radius:50%; border:2px solid var(--oro); background:#fff; object-fit:cover;}
.logo-fallback{width:50px; height:50px; border-radius:50%; background:var(--oro); display:flex; align-items:center; justify-content:center; font-weight:900; color:#000;}
.logo-text{font-size:1.3rem; font-weight:900; color:var(--oro);}
#cart-btn{background:var(--oro); color:#000; padding:10px 15px; border:none; font-weight:900; cursor:pointer; border-radius:5px;}
.hero{background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=1200') center/cover; height:60vh; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff;}
.hero h1{font-size:2.5rem; color:var(--oro);}
section{padding:50px 20px; max-width:1200px; margin:0 auto;}
h2{text-align:center; font-size:2rem; margin-bottom:30px;}
.btn{background:var(--oro); color:#000; padding:12px 25px; text-decoration:none; font-weight:900; display:inline-block; border:none; cursor:pointer; border-radius:5px;}
.grid-prod{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px;}
.card{background:#fff; padding:15px; text-align:center; border-radius:8px;}
.card img{width:100%; height:200px; object-fit:cover; background:#ddd;}
.precio{font-size:1.4rem; color:var(--oro); font-weight:900;}
#cart-sidebar{position:fixed; top:0; right:-350px; width:350px; height:100%; background:#fff; transition:0.3s; z-index:999; padding:20px;}
#cart-sidebar.active{right:0;}
.whatsapp-float{position:fixed; bottom:20px; right:20px; background:var(--whatsapp); color:#fff; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:35px; text-decoration:none;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo-header">
      <!-- SI NO HAY LOGO, SALE "DR" -->
      <img src="logo-donroberto.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';">
      <div id="logo-fallback" class="logo-fallback" style="display:none;">DR</div>
      <div class="logo-text">AHUMADOS DON ROBERTO</div>
    </div>
    <button id="cart-btn">🛒 CARRITO (<span id="cart-count">0</span>)</button>
  </div>
</header>

<section class="hero">
  <div>
    <h1>EL SABOR TRADICIONAL AHUMADO</h1>
    <a href="#productos" class="btn">VER PRODUCTOS</a>
  </div>
</section>

<section id="productos">
  <h2>NUESTROS PRODUCTOS</h2>
  <div class="grid-prod">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?q=80&w=400" alt="Cecina">
      <h3>Cecina Ahumada Premium</h3>
      <div class="precio">S/ 38.00</div>
      <button class="btn" onclick="alert('Añadido al carrito')">Añadir</button>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1615937657715-bc7b4b7b4c8e?q=80&w=400" alt="Chorizo">
      <h3>Chorizo Ahumado Casero</h3>
      <div class="precio">S/ 28.00</div>
      <button class="btn" onclick="alert('Añadido al carrito')">Añadir</button>
    </div>
  </div>
</section>

<footer style="background:#000; color:#888; text-align:center; padding:30px;">
  <p><b>AHUMADOS DON ROBERTO</b> | WHATSAPP: 935 986 861</p>
</footer>

<a href="https://wa.me/51935986861" target="_blank" class="whatsapp-float">📱</a>

<script>
let cartCount = 0;
document.getElementById('cart-btn').onclick = () => alert('Carrito: ' + cartCount + ' productos');
</script>

</body>
</html>
